<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreMony - n</title>
    <link rel="icon" type="image/x-icon" href="/images/Icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/sheetStyle.css">
</head>
<body>
    <header>
      <div class="topnav">
        <a href="javascript:void(0);" class="icon search" onclick="headerSlidePush('search')">
          <img src="images/searchIcon.svg" alt="">
        </a>
        <div class="search user">
          <a href="home.html" id="home"><img src="images/Icon.png" alt="Icon"></a>
          <div id="search" class="slide search">
            <input type="text" placeholder="Search.." name="search">
            <button type="submit"><i class="fa fa-search"></i></button>
          </div>
          <div id="user" class="slide user">
            <h2 id="username">Anonymous12345</h2>
            <a href="login.html" id="logOut"><img src="images/LogOut.png" alt="LogOut"></a>
          </div>
        </div>
        <a href="javascript:void(0);" class="icon user" onclick="headerSlidePush('user')">
          <img src="images/UserIcon.png" alt="">
        </a>
      </div>
    </header>
    <div id="main">
        <div id="sheet">
        </div>
        <div class="details">
            <div id="details">
                <div>
                    <p>Név:</p>
                    <p id="name"></p>
                </div>
                <div>
                    <p>Stílus:</p>
                    <p id="genre"></p>
                </div>
                <div>
                    <p>Zeneszerző:</p>
                    <p id="artist"></p>
                </div>
                <div>
                    <p>Hangszer:</p>
                    <p id="instrument"></p>
                </div>
                <div>
                    <p>Kulcs:</p>
                    <p id="key"></p>
                </div>
                <div>
                    <p>Nehézség:</p>
                    <p id="difficulty"></p>
                </div>
            </div>
            <form oninput="out.value=inp.value">
              <div>
                <output name="out" for="inp">100</output>
                <h2>BPM</h2>
              </div>
              <div>
                <input id="metronomeSpeedSlider" name="inp" type="range" min="40" max="218" value="100">
              </div>
              <div>
                <button type="button" id="metronomeToggle" onclick="metronomeFlipflop()"><img src="images/start.svg"></button>
              </div>
            </form>
            <a id="downloadPDF" href="" download>Letöltés<img src="images/downloadIcon.svg" alt="download icon"></a>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="sheet.js"></script>
</body>
</html>
