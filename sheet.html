<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreMony</title>
    <link rel="icon" type="image/x-icon" href="../images/Icon.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/sheetStyle.css">
</head>
<body>
    <header>
      <div class="topnav">
        <button class="icon search" onclick="headerSlidePush('search')">
          <span class="material-symbols-outlined">
            search
          </span>
        </button>
        <div class="search user">
          <a href="home.html" id="home"><img src="images/Icon.png" alt="Icon"></a>
          <div id="search" class="slide search">
            <input type="text" placeholder="Search.." name="search">
            <button type="submit">
              <span class="material-symbols-outlined">search</span>
            </button>
          </div>
          <div id="user" class="slide user">
            <h2 id="username">Anonymous12345</h2>
            <a href="login.html" id="logOut">
              <span class="material-symbols-outlined">
                logout
              </span>
            </a>
          </div>
        </div>
        <button class="icon user" onclick="headerSlidePush('user')">
          <span class="material-symbols-outlined">
            person
          </span>
        </button>
      </div>
    </header>
    <div id="main">
        <div id="sheet" class="sheet">
          <button class="fixedIcons download" id="download" type="button">
            <a href="" download><img src="images/downloadIcon2.svg"></a>
          </button>
          <button class="fixedIcons" id="metronomeBtn" class type="button" onclick="metronomeModal()">
            <img src="images/landingMetronome.png">
          </button>
          <button class="fixedIcons maximize" id="maximize" onclick="toggleFullscreen()" type="button">
            <span class="material-symbols-outlined">zoom_out_map</span>
          </button>
        </div>
        <div class="details">
          <button type="button" class="closeBtn" onclick="openDetails()">
            <span class="material-symbols-outlined">
              chevron_forward
            </span>
          </button>
            <div id="details">
                <div>
                    <p>Név:</p>
                    <p id="name"></p>
                </div>
                <div>
                    <p>Stílus:</p>
                    <p id="genre"></p>
                </div>
                <div>
                    <p>Zeneszerző:</p>
                    <p id="artist"></p>
                </div>
                <div>
                    <p>Hangszer:</p>
                    <p id="instrument"></p>
                </div>
                <div>
                    <p>Kulcs:</p>
                    <p id="key"></p>
                </div>
                <div>
                    <p>Nehézség:</p>
                    <p id="difficulty"></p>
                </div>
            </div>
            <form class="metronome" oninput="out.value=inp.value">
              <div>
                <output name="out" for="inp">100</output>
                <h2>BPM</h2>
              </div>
              <div>
                <input id="metronomeSpeedSlider" name="inp" type="range" min="40" max="218" value="100">
              </div>
              <div>
                <button type="button" id="metronomeToggle" onclick="metronomeFlipflop()"><img src="images/start.svg"></button>
              </div>
            </form>
            <a id="downloadPDF" href="" download>Letöltés<img src="images/downloadIcon.svg" alt="download icon"></a>
        </div>
        <button type="button" class="collapse-menu" onclick="openDetails()">
          <span class="material-symbols-outlined">
            chevron_backward
          </span>
        </button>
    </div>
    <div id="metronomeModal" class="">
      <form class="metronome">
      <div>
        <output name="out" for="inp">100</output>
        <h2>BPM</h2>
      </div>
      <div>
        <input id="metronomeSpeedSlider" name="inp" type="range" min="40" max="218" value="100">
      </div>
      <div>
        <button type="button" id="closeBtn" onclick="metronomeModal()">
          <span class="material-symbols-outlined">
            close
          </span>
        </button>
        <button type="button" id="metronomeToggle" onclick="metronomeFlipflop()"><img src="images/start.svg"></button>
      </div>
    </form>
    </div>
    <script src="app.js"></script>
    <script src="sheet.js"></script>
</body>
</html>
